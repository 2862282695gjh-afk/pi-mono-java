apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusclaw
  namespace: campusclaw
  labels:
    app.kubernetes.io/name: campusclaw
    app.kubernetes.io/component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: campusclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campusclaw
        app.kubernetes.io/component: application
    spec:
      containers:
        - name: campusclaw
          image: campusclaw:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["sh", "-c"]
          args: ["exec java $JAVA_OPTS -jar /app/app.jar"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: CAMPUSCLAW_HOME
              value: "/data"
            - name: JAVA_OPTS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: tmp-volume
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: campusclaw-data-pvc
        - name: tmp-volume
          emptyDir:
            sizeLimit: 1Gi
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
