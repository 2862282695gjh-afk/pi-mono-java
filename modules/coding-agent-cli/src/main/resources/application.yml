spring:
  main:
    banner-mode: off
    lazy-initialization: true
    web-application-type: none
  application:
    name: campusclaw-agent
  datasource:
    url: ${GAUSSDB_URL:jdbc:opengauss://localhost:5432/campusclaw}
    username: ${GAUSSDB_USER:campusclaw}
    password: ${GAUSSDB_PASSWORD:}
    driver-class-name: org.opengauss.Driver
    hikari:
      pool-name: campusclaw-session-pool
      minimum-idle: ${GAUSSDB_MIN_IDLE:1}
      maximum-pool-size: ${GAUSSDB_MAX_POOL_SIZE:10}
      connection-timeout: ${GAUSSDB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${GAUSSDB_VALIDATION_TIMEOUT_MS:5000}
      initialization-fail-timeout: ${GAUSSDB_INITIALIZATION_FAIL_TIMEOUT_MS:-1}
      data-source-properties:
        currentSchema: ${GAUSSDB_SCHEMA:campusclaw_session}
        sslmode: ${GAUSSDB_SSL_MODE:verify-full}

mybatis:
  mapper-locations: classpath*:mapper/session/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 服务器模式（--mode server）下 /api/ws/chat 与 /api/chat 的会话持久化
# 开启后会把每个 conversation_id 的消息历史写入
# ~/.campusclaw/agent/sessions/--<encoded-cwd>--/<id>.jsonl
# 重连或进程重启后用同一个 conversation_id 可恢复历史
server:
  session:
    persistence:
      enabled: true

# CampusMate managed-Agent runtime. The HTTP endpoint is only used when an
# agent_id is selected and ./agent/{agentId} does not exist locally.
campusmate:
  runtime:
    base-url: ${CAMPUSMATE_RUNTIME_BASE_URL:http://campusmate-service:8080}
    agents-root: ${CAMPUSCLAW_AGENTS_ROOT:agent}
    connect-timeout: PT10S
    request-timeout: PT30S
    success-code: ${CAMPUSMATE_SUCCESS_CODE:0}
    max-response-bytes: ${CAMPUSMATE_MAX_RESPONSE_BYTES:4194304}

logging:
  level:
    root: WARN
    com.campusclaw: WARN
    io.netty: ERROR
    # Banner logger 独立级别，让 `pi --mode server` 启动 endpoint 列表无论 root/包级
    # 怎么调都能打出来——这是面向操作者的启动反馈，不该被生产噪音过滤策略误伤。
    CampusClawStartupBanner: INFO

# 子 agent 后端配置 (spawn_agent 工具)
# 主 agent 通过 spawn_agent 工具调用其它 coding agent；下方每个 entry 是一种后端。
# type=acp: 走 ACP 协议 + stdio (Claude Code, Codex/Gemini 等)
# type=http: 走自有 HTTP/ndJSON 协议 (URL + 鉴权)
# type=a2a: 走华为 mate-service 包装的 A2A JSON-RPC (X-HW-ID + X-HW-APPKEY 双 header)
# disabled=true 可临时关闭某条而不删整段
subagent:
  enabled: true
  approval:
    # 子代理工具调用权限策略：
    #   allow - 全部 AUTO_ALLOW（子代理共用父代理信任域，开箱即用，默认值）
    #   ask   - 只读工具 AUTO_ALLOW，其它走 ParentPermissionResolver；
    #           默认 TimeoutDeniedResolver 直接拒，需自行实现 interactive resolver 才有意义
    #   deny  - 全部拒绝（用于演练 / 沙盒测试）
    default: allow
  backends:
    claude-code:
      type: acp
      disabled: false
      command: claude-code-acp
      args: []
      prompt-timeout: PT15M
      client-name: campusclaw-acp
      client-version: 1.0.0
    codex:
      type: acp
      disabled: true
      command: codex-acp
      args: []
      prompt-timeout: PT15M
    # 远端 HTTP agent 示例（默认禁用；启用时设置 url + auth-token）
    remote-http:
      type: http
      disabled: true
      url: https://agent.example.com/api
      auth-type: bearer    # bearer | header | none
      auth-token: ${CAMPUSCLAW_REMOTE_AGENT_TOKEN:}
      connect-timeout: PT10S
      request-timeout: PT30S
      prompt-timeout: PT10M
    # 华为 mate-service A2A agent 示例（默认禁用；启用时填入 hw-id + hw-app-key）
    # url 是 mate-service 的 A2A request 入口，agent-name 会作为路径段拼到末尾
    mate-kqa:
      type: a2a
      disabled: true
      url: https://71.9.8.186:1433/mate-service/v1/a2a/request
      agent-name: KnowledgeQAAgent
      hw-id: ${HW_ID:a2a_test}
      hw-app-key: ${HW_APPKEY:}
      model: 100003         # 可选；spawn_agent 传 model 时覆盖此值
      connect-timeout: PT10S
      request-timeout: PT60S
      # 仅当对端证书无法加入 JDK truststore（如 PoC 调内网自签 CA）时打开；
      # 生产请把公司 CA 导入 cacerts 或用 -Djavax.net.ssl.trustStore 指定独立 keystore。
      insecure-skip-verify: false

# Control plane in-process configuration. Control plane runs as a set of beans inside
# the main CampusClawApplication JVM (not a separate sidecar process), so it shares
# spring/server/logging blocks with the main application above. Only control-plane-specific
# tuning lives under this root.
controlplane:
  heartbeat:
    # A node missing heartbeats for longer than `ttl` is marked STALE.
    ttl: PT30S
    # How often the cleanup task scans the registry.
    sweep-interval: PT10S
    # How long a STALE node lingers before being removed entirely.
    grace-after-stale: PT5M

# Mate inner gateway service address used by the Mate tool client
# (listMateTool / callMateTool). Inner gateway endpoints do not require
# credential headers. Resolved from the MATE_INNERGWSERIVE environment
# variable (see install-values.sh, which reads it from the mateservice
# ClusterIP); empty by default so an unconfigured environment still boots.
mate:
  innerGWSerive: ${MATE_INNERGWSERIVE:}
