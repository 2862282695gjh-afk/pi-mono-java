spring:
  main:
    banner-mode: off
  application:
    name: campusclaw-agent
  threads:
    virtual:
      enabled: true
  datasource:
    # openGauss 兼容 PostgreSQL wire/JDBC；标准 pgjdbc 可避免 openGauss 7.0.0-RC3
    # Maven 制品在可执行包内嵌入第二套 SLF4J API。
    url: ${GAUSSDB_URL:jdbc:postgresql://localhost:5432/campusclaw}
    username: ${GAUSSDB_USER:campusclaw}
    password: ${GAUSSDB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: campusclaw-session-pool
      minimum-idle: ${GAUSSDB_MIN_IDLE:1}
      maximum-pool-size: ${GAUSSDB_MAX_POOL_SIZE:10}
      connection-timeout: ${GAUSSDB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${GAUSSDB_VALIDATION_TIMEOUT_MS:5000}
      initialization-fail-timeout: ${GAUSSDB_INITIALIZATION_FAIL_TIMEOUT_MS:1}
      data-source-properties:
        currentSchema: ${GAUSSDB_SCHEMA:campusclaw_session}
        sslmode: ${GAUSSDB_SSL_MODE:verify-full}

mybatis:
  mapper-locations: classpath*:mapper/session/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

campusclaw:
  tools:
    runtime:
      - Read
      - Find
      - Grep
      - Ls
      - Cron
      - ListMateTools
      - CallMateTool
      - Agent
    cron:
      - Read
      - Find
      - Grep
      - Ls
      - ListMateTools
      - CallMateTool
      - Agent
    child-agent:
      - Read
      - Find
      - Grep
      - Ls
      - ListMateTools
      - CallMateTool
  runtime:
    compaction:
      enabled: ${CAMPUSCLAW_COMPACTION_ENABLED:true}
      reserve-tokens: ${CAMPUSCLAW_COMPACTION_RESERVE_TOKENS:16384}
      keep-recent-tokens: ${CAMPUSCLAW_COMPACTION_KEEP_RECENT_TOKENS:20000}
      summary-retry-enabled: ${CAMPUSCLAW_COMPACTION_SUMMARY_RETRY_ENABLED:true}
      summary-max-retries: ${CAMPUSCLAW_COMPACTION_SUMMARY_MAX_RETRIES:3}
      summary-retry-base-delay-ms: ${CAMPUSCLAW_COMPACTION_SUMMARY_RETRY_BASE_DELAY_MS:2000}
    execution:
      max-active: ${CAMPUSCLAW_MAX_ACTIVE_EXECUTIONS:100}
      max-duration: ${CAMPUSCLAW_MAX_EXECUTION_DURATION:PT30M}
      max-control-messages: ${CAMPUSCLAW_MAX_CONTROL_MESSAGES:32}
      max-control-bytes: ${CAMPUSCLAW_MAX_CONTROL_BYTES:1048576}
    events:
      # 生产和多实例部署必须设置稳定的高熵密钥；缺失时使用仅限当前进程的随机密钥。
      cursor-secret: ${CAMPUSCLAW_EVENT_CURSOR_SECRET:}
      cursor-ttl: ${CAMPUSCLAW_EVENT_CURSOR_TTL:PT24H}
      stream-buffer-events: ${CAMPUSCLAW_STREAM_BUFFER_EVENTS:256}
      stream-buffer-bytes: ${CAMPUSCLAW_STREAM_BUFFER_BYTES:1048576}
      heartbeat-interval: ${CAMPUSCLAW_SSE_HEARTBEAT_INTERVAL:PT15S}
    cleanup:
      enabled: ${CAMPUSCLAW_CLEANUP_ENABLED:true}
      batch-size: ${CAMPUSCLAW_CLEANUP_BATCH_SIZE:10}
      retry-delay: ${CAMPUSCLAW_CLEANUP_RETRY_DELAY:PT30S}
      running-timeout: ${CAMPUSCLAW_CLEANUP_RUNNING_TIMEOUT:PT5M}
      poll-interval-ms: ${CAMPUSCLAW_CLEANUP_POLL_INTERVAL_MS:5000}

# CampusMate 受管 Agent 运行目录。HTTP、Cron 和 Child 共用这一缓存与远端准备流程。
campusmate:
  model-manager:
    base-url: ${CAMPUSMATE_MODEL_MANAGER_BASE_URL:https://localhost:8591}
    chat-path: ${CAMPUSMATE_MODEL_MANAGER_CHAT_PATH:/mate-service/v1/LLM/chat}
    api: ${CAMPUSMATE_MODEL_MANAGER_API:openai-completions}
    connect-timeout: ${CAMPUSMATE_MODEL_MANAGER_CONNECT_TIMEOUT:PT10S}
    response-timeout: ${CAMPUSMATE_MODEL_MANAGER_RESPONSE_TIMEOUT:PT10M}
    context-window: ${CAMPUSMATE_MODEL_MANAGER_CONTEXT_WINDOW:128000}
    max-output-tokens: ${CAMPUSMATE_MODEL_MANAGER_MAX_OUTPUT_TOKENS:8192}
    reasoning: ${CAMPUSMATE_MODEL_MANAGER_REASONING:true}
  runtime:
    base-url: ${CAMPUSMATE_RUNTIME_BASE_URL:http://campusmate-service:8080}
    agents-root: ${CAMPUSCLAW_AGENTS_ROOT:agent}
    connect-timeout: PT10S
    request-timeout: PT30S
    success-code: ${CAMPUSMATE_SUCCESS_CODE:0}
    max-response-bytes: ${CAMPUSMATE_MAX_RESPONSE_BYTES:4194304}
    agent-runtime-path-template: ${CAMPUSMATE_AGENT_RUNTIME_PATH_TEMPLATE:/mate-service/v1/agents/%s/runtime}
    skill-info-query-path-template: ${CAMPUSMATE_SKILL_INFO_QUERY_PATH_TEMPLATE:/mate-service/v1/skill/query/%s}

logging:
  level:
    root: WARN
    com.campusclaw: WARN
    io.netty: ERROR

# Control plane in-process configuration. Control plane runs as a set of beans inside
# the main CampusClawApplication JVM (not a separate sidecar process), so it shares
# spring/server/logging blocks with the main application above. Only control-plane-specific
# tuning lives under this root.
controlplane:
  heartbeat:
    # A node missing heartbeats for longer than `ttl` is marked STALE.
    ttl: PT30S
    # How often the cleanup task scans the registry.
    sweep-interval: PT10S
    # How long a STALE node lingers before being removed entirely.
    grace-after-stale: PT5M

# Mate inner gateway service address used by the Mate tool client
# (ListMateTools / CallMateTool). Discovery endpoints allow empty credentials but
# receive the current execution snapshot when available. Resolved from MATE_INNERGWSERIVE
# variable (see install-values.sh, which reads it from the mateservice
# ClusterIP); empty by default so an unconfigured environment still boots.
mate:
  innerGWSerive: ${MATE_INNERGWSERIVE:}
  endpoints:
    agent-info-path-prefix: ${MATE_AGENT_INFO_PATH_PREFIX:/mate-service/v1/agents/}
    skill-tools-query-path-prefix: ${MATE_SKILL_TOOLS_QUERY_PATH_PREFIX:/mate-service/v1/skill/query/}
    tool-metadata-query-path: ${MATE_TOOL_METADATA_QUERY_PATH:/mate-service/v1/runtime/tools/query}
    tool-execute-path-template: ${MATE_TOOL_EXECUTE_PATH_TEMPLATE:/mate-service/v1/runtime/tools/%s/execute}
