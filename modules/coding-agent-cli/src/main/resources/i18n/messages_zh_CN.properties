INVALID_AGENT_ID=agent_id 格式不正确。
INVALID_SESSION_ID=sessionId 格式不正确。
AGENT_NOT_FOUND=指定的 Agent 不存在。
AGENT_NOT_AVAILABLE=指定的 Agent 当前不可用。
INVALID_COMMAND_REQUEST=命令请求无效。
COMMAND_NOT_FOUND=指定的命令不存在。
COMMAND_EXECUTION_FAILED=命令执行失败。
AGENT_MODEL_NOT_CONFIGURED=该 Agent 未配置有效的默认模型。
SESSION_NOT_FOUND=指定的 Session 不存在。
SESSION_BUSY=该 Session 正在处理另一条用户消息。
SESSION_INITIALIZATION_FAILED=Session 初始化失败。
SESSION_DELETE_FAILED=Session 删除失败。
SESSION_NAME_UPDATE_FAILED=Session 名称更新失败。
INVALID_EVENT_REQUEST=用户事件请求内容不符合约束。
EVENT_ACCEPTANCE_FAILED=用户事件接收失败。
SESSION_EXECUTION_FAILED=Session 执行失败。
INVALID_EVENT_LIST_QUERY=事件分页参数不符合约束。
EVENT_LIST_FAILED=Session 持久化事件读取失败。
INVALID_MODEL_REQUEST=模型切换请求不符合约束。
INVALID_THINKING_REQUEST=深度思考设置请求不符合约束。
MODEL_NOT_AVAILABLE=指定模型当前不可用于该 Session。
THINKING_NOT_SUPPORTED=当前模型不支持深度思考。
IF_MATCH_REQUIRED=修改 Session 配置必须携带 If-Match。
SESSION_VERSION_MISMATCH=Session 已发生变化，请刷新后重试。
SESSION_MODEL_UPDATE_FAILED=Session 模型更新失败。
SESSION_THINKING_UPDATE_FAILED=Session 深度思考设置更新失败。
INVALID_STEER_REQUEST=Steering Message 请求不符合约束。
INVALID_FOLLOW_UP_REQUEST=FollowUp Message 请求不符合约束。
SESSION_NOT_RUNNING=该 Session 当前没有正在运行的执行。
INTERRUPT_TARGET_MISMATCH=中断目标不是当前未完成消息。
INTERRUPT_ALREADY_REQUESTED=该执行已接受停止请求。
TOOL_CONFIRMATION_NOT_PENDING=指定的工具调用当前不等待确认。
EXECUTION_STOPPING=该执行正在停止，不能再确认工具调用。
SESSION_EXECUTION_UNAVAILABLE=Session 当前执行归属于其他 Runtime 实例。
STEER_ACCEPTANCE_FAILED=Steering Message 接收失败。
FOLLOW_UP_ACCEPTANCE_FAILED=FollowUp Message 接收失败。
SESSION_ABORT_FAILED=Session 当前执行中止失败。
RUNTIME_CAPACITY_EXCEEDED=Runtime 执行容量已满，请稍后重试。
CONTROL_QUEUE_FULL=当前执行的控制消息队列已满。
MANAGER_UNAVAILABLE=Model Manager 暂时不可用，请稍后重试。
INTERNAL_ERROR=服务内部错误。
MATE_REQUEST_FAILED=CampusMate 请求失败。
MATE_RESPONSE_INVALID=CampusMate 响应格式不正确。
MATE_RESPONSE_TOO_LARGE=CampusMate 响应超过允许的大小。
MATE_CONFIG_MISSING=CampusMate Runtime 配置不可用。
RUNTIME_PREPARE_FAILED=Agent Runtime 准备失败。
MATE_TOOL_RESPONSE_INVALID=CampusMate 工具响应格式不正确。
TOOL_CALL_DENIED=用户已拒绝，本次工具调用未执行。
TOOL_ARGUMENTS_INVALID=工具参数不符合约束，本次调用未执行。
TOOL_NOT_FOUND=指定的工具当前不可用，本次调用未执行。
TOOL_EXECUTION_TIMEOUT=工具调用超时，实际执行结果可能仍需核对。
TOOL_EXECUTION_FAILED=工具执行失败，请核对执行结果。
AGENT_EXECUTION_FAILED=本次 Agent 执行失败。
MODEL_REQUEST_FAILED=模型请求失败。
EXECUTION_START_FAILED=消息已接受，但执行未能启动。
EXECUTION_RESUME_FAILED=确认已接受，但执行未能继续。
EVENT_PAYLOAD_TOO_LARGE=输出超过当前容量上限，本次执行失败。
