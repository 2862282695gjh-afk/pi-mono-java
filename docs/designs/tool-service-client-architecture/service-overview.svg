<text x="1800.0" y="65" font-family="Times New Roman, Songti SC, serif" font-size="42" fill="#302E2A" text-anchor="middle">工具调用总览 · CampusClaw ↔ CampusMate</text>
<text x="1800.0" y="121" font-family="Times New Roman, Songti SC, serif" font-size="27" fill="#72777D" text-anchor="middle">蓝：Agent 级业务工具　红：Skill 级业务工具　绿：共用执行链　虚线：装配 / 发现 / 工作流</text>
