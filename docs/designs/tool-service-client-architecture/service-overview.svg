<text x="1270.0" y="239" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">CampusClaw · Agent Runtime 服务</text>
<rect x="2570" y="195" width="975" height="2130" rx="20" fill="#F3F3F3" stroke="#A3A3A3" stroke-width="2"/>
<text x="3057.5" y="239" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">CampusMate · mate-service</text>
<rect x="105" y="585" width="1080" height="740" rx="20" fill="#FFFBF3" stroke="#D7A342" stroke-width="2"/>
<text x="645.0" y="629" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">① Agent 级：Session 创建时装配</text>
