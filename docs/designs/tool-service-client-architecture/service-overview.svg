<text x="1855.0" y="629" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">② Skill 级：按需读正文 / 取定义 / 调用</text>
<rect x="105" y="1400" width="2330" height="450" rx="20" fill="#FFFBF3" stroke="#D7A342" stroke-width="2"/>
<text x="1270.0" y="1444" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">③ Session 共用工具执行与解析层</text>
