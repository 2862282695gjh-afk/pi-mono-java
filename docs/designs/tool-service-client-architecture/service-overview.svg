<path d="M1090,810 L1225,810 L1225,1375 L1630,1375 L1630,1510" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#a2886CE)"/>
<path d="M2350,810 L2405,810 L2405,1470 L2060,1470 L2060,1510" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#aC74738)"/>
<path d="M1840,1770 L1840,1950 L1680,1950 L1680,2010" fill="none" stroke="#72777D" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#a72777D)"/>
<path d="M750,1770 L750,1915 L1120,1915 L1120,2010" fill="none" stroke="#398D42" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a398D42)"/>
<text x="948" y="1888" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#398D42" text-anchor="middle">固定的远端 handler</text>
<text x="2095" y="1930" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#72777D" text-anchor="middle">发现：不带凭据</text>
<path d="M2110,2060 L2515,2060 L2515,1580 L2670,1580" fill="none" stroke="#72777D" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#a72777D)"/>
