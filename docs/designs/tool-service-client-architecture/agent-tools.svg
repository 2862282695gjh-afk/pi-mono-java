<rect width="3200" height="2070" fill="white"/>
<text x="1600.0" y="65" font-family="Times New Roman, Songti SC, serif" font-size="42" fill="#302E2A" text-anchor="middle">模块一 · Agent 绑定工具的装配与直接调用</text>
<text x="1600.0" y="121" font-family="Times New Roman, Songti SC, serif" font-size="27" fill="#72777D" text-anchor="middle">蓝：Session 装配与发现　红：调用准备　绿：权限通过后执行　虚线：元数据 / 结果传递</text>
<rect x="55" y="195" width="3090" height="835" rx="20" fill="#FFFBF3" stroke="#D7A342" stroke-width="2"/>
<text x="1600.0" y="239" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">① 装配期：每个 Session 独立创建 Resolver / Executor / 缓存</text>
<rect x="55" y="1160" width="3090" height="780" rx="20" fill="#F7F9FC" stroke="#B2BAC4" stroke-width="2"/>
<text x="1600.0" y="1204" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">② 调用期：真实工具 Schema 校验 → 准备快照 → Host 权限 → 执行同一快照</text>
<path d="M530,440 L665,440" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M1165,440 L1300,440" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M1600,570 L1600,632 L920,632 L920,750" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M1165,835 L1300,835" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M1860,835 L1940,835 L1940,610 L2070,610 L2070,460 L2110,460" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M2540,440 L2670,440" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M1860,875 L2110,875" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M2540,835 L2670,835" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M100 350 H508 L530 372 V530 H100 Z M508 350 V372 H530" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="315.0" y="416.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">受管 Agent 元数据</text>
<text x="315.0" y="454.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">agent/{agentId}/</text>
<text x="315.0" y="492.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">.campusclaw/agent.json</text>
<rect x="665" y="340" width="500" height="200" rx="20" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="915.0" y="416.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">AgentSessionFactory</text>
<text x="915.0" y="454.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Runtime / Cron / Child 共用</text>
<text x="915.0" y="492.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">prepare 目录 → createSession</text>
<path d="M1300 305 H1878 L1900 327 V570 H1300 Z M1878 305 V327 H1900" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="1600.0" y="393.0" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">MateToolsetFactory</text>
<text x="1600.0" y="435.0" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">→ MateToolSessionState</text>
<text x="1600.0" y="473.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Session 私有 Resolver / Executor</text>
<text x="1600.0" y="511.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">持有本次执行凭据快照</text>
<rect x="2110" y="330" width="430" height="220" rx="20" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="2325.0" y="416.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">HttpMateToolClient</text>
<text x="2325.0" y="454.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">listAgentTools(agentId)</text>
<text x="2325.0" y="492.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">发现不带凭据</text>
<path d="M2670 329 A215.0 19 0 0 1 3100 329 V551 A215.0 19 0 0 1 2670 551 Z" fill="#F1F1F1" stroke="#302E2A" stroke-width="2"/><ellipse cx="2885.0" cy="329" rx="215.0" ry="19" fill="#F1F1F1" stroke="#302E2A" stroke-width="2"/>
<text x="2885.0" y="409.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">CampusMate</text>
<text x="2885.0" y="447.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">GET agents/{id}</text>
<text x="2885.0" y="485.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">POST runtime/tools/query</text>
<text x="2885.0" y="523.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">绑定 ID → 完整元数据</text>
<rect x="675" y="750" width="490" height="210" rx="20" fill="#FFFFFF" stroke="#302E2A" stroke-width="2"/>
<text x="920.0" y="810.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">DefaultConfiguredToolAssembler</text>
<text x="920.0" y="848.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">#assemble</text>
<text x="920.0" y="886.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">按入口配置创建框架工具</text>
<text x="920.0" y="924.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">请求业务代理并检查名称冲突</text>
<path d="M1300 750 H1838 L1860 772 V960 H1300 Z M1838 750 V772 H1860" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="1580.0" y="831.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">MateToolResolver</text>
<text x="1580.0" y="869.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">resolveAgentTools()</text>
<text x="1580.0" y="907.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">缓存可信 ResolvedTool</text>
<path d="M2110 750 H2518 L2540 772 V960 H2110 Z M2518 750 V772 H2540" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="2325.0" y="812.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">MateToolAdapter × N</text>
<text x="2325.0" y="850.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Executor 包装解析结果</text>
<text x="2325.0" y="888.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">真实 name / inputSchema</text>
<text x="2325.0" y="926.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">AgentTool · SEQUENTIAL</text>
<rect x="2670" y="750" width="430" height="210" rx="20" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="2885.0" y="831.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">初始工具集合</text>
<text x="2885.0" y="869.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">框架工具 + 业务代理</text>
<text x="2885.0" y="907.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Agent.setTools(...)</text>
<text x="1600" y="1000" font-family="Times New Roman, Songti SC, serif" font-size="27" fill="#72777D" text-anchor="middle">显式空工具配置直接返回空集合；业务代理也不追加。业务工具不能与框架工具或彼此重名。</text>
<path d="M2885,960 L2885,1095 L320,1095 L320,1260" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#a2886CE)"/>
<text x="1760" y="1080" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#2886CE" text-anchor="middle">装配后暴露给模型：从第一轮即可按真实业务名调用</text>
<path d="M540,1360 L680,1360" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#aC74738)"/>
<path d="M1240,1360 L1370,1360" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#aC74738)"/>
<path d="M2130,1360 L2310,1360" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#aC74738)"/>
<path d="M2675,1480 L2675,1580 L1695,1580 L1695,1680" fill="none" stroke="#398D42" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a398D42)"/>
<path d="M2675,1580 L2675,1680" fill="none" stroke="#398D42" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a398D42)"/>
<rect x="100" y="1260" width="440" height="200" rx="20" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="320.0" y="1336.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">模型 tool_use</text>
<text x="320.0" y="1374.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">name = 真实业务工具名</text>
<text x="320.0" y="1412.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">arguments = 业务参数</text>
<rect x="680" y="1260" width="560" height="200" rx="20" fill="#FFF1ED" stroke="#C74738" stroke-width="2"/>
<text x="960.0" y="1336.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#C74738" text-anchor="middle">ToolExecutionPipeline</text>
<text x="960.0" y="1374.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">先按 Adapter 的真实 Schema 校验</text>
<text x="960.0" y="1412.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">再调用 Adapter.prepare(...)</text>
<path d="M1370 1240 H2108 L2130 1262 V1480 H1370 Z M2108 1240 V1262 H2130" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="1750.0" y="1315.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">MateToolAdapter → MateToolExecutor</text>
<text x="1750.0" y="1357.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">prepareAgent(...)</text>
<text x="1750.0" y="1395.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Dispatcher 在此选择并固定 handler</text>
<text x="1750.0" y="1433.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">生成 PreparedToolInvocation 不可变快照</text>
<rect x="2310" y="1260" width="730" height="220" rx="20" fill="#F0F8ED" stroke="#398D42" stroke-width="2"/>
<text x="2675.0" y="1346.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#398D42" text-anchor="middle">Host 权限检查</text>
<text x="2675.0" y="1384.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">按快照中的真实工具身份判断</text>
<text x="2675.0" y="1422.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">通过后仅执行同一份 invocation</text>
<rect x="1320" y="1680" width="750" height="190" rx="20" fill="#F5EFFF" stroke="#805AC7" stroke-width="2"/>
<text x="1695.0" y="1751.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#805AC7" text-anchor="middle">已固定的本地 handler</text>
<text x="1695.0" y="1789.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">confirm_with_user → BusinessConfirmationAdapter</text>
<text x="1695.0" y="1827.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Runtime 问答；本地失败不转远端</text>
<rect x="2310" y="1680" width="730" height="190" rx="20" fill="#F0F8ED" stroke="#398D42" stroke-width="2"/>
<text x="2675.0" y="1732.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#398D42" text-anchor="middle">已固定的远端 handler</text>
<text x="2675.0" y="1770.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">MateRemoteToolHandler → HttpMateToolClient</text>
<text x="2675.0" y="1808.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">POST runtime/tools/{toolId}/execute</text>
<text x="2675.0" y="1846.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">携带凭据；发送一次，不自动重放</text>
<text x="1600" y="1990" font-family="Times New Roman, Songti SC, serif" font-size="28" fill="#302E2A" text-anchor="middle">边界：发现不授权；普通业务工具遵循 allow / ask / deny；业务问答仅 ALLOW 可进入本地问答流程。</text>
<text x="3120" y="2038" font-family="Times New Roman, Songti SC, serif" font-size="22" fill="#72777D" text-anchor="end">源码核验：553dcd5e · CampusClaw / pi-mono-java</text>
</svg>
