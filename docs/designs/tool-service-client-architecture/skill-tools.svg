<rect width="3400" height="2240" fill="white"/>
<text x="1700.0" y="65" font-family="Times New Roman, Songti SC, serif" font-size="42" fill="#302E2A" text-anchor="middle">模块二 · Skill → SearchTools → CallTool 渐进发现</text>
<text x="1700.0" y="121" font-family="Times New Roman, Songti SC, serif" font-size="27" fill="#72777D" text-anchor="middle">三步是模型的典型工作流；读取与发现不注册业务工具、不授予权限，也不是 CallTool 的强制状态门禁</text>
<rect x="55" y="205" width="3290" height="425" rx="20" fill="#F4F8FE" stroke="#90B4D0" stroke-width="2"/>
<text x="1700.0" y="249" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">① Skill({name})：按需读取正文，获得工具技术名</text>
<rect x="55" y="690" width="3290" height="690" rx="20" fill="#FFFBF3" stroke="#D7A342" stroke-width="2"/>
<text x="1700.0" y="734" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">② SearchTools({tool})：按精确技术名披露单个完整定义</text>
<rect x="55" y="1430" width="3290" height="560" rx="20" fill="#F3F9F0" stroke="#91B28A" stroke-width="2"/>
<text x="1700.0" y="1474" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">③ CallTool({tool, args})：可信解析 → 校验 → 权限 → 执行</text>
<path d="M530,420 L670,420" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M1300,420 L1450,420" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M2240,420 L2410,420" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<rect x="110" y="320" width="420" height="190" rx="20" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="320.0" y="410.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">模型</text>
<text x="320.0" y="448.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Skill({name})</text>
<rect x="670" y="310" width="630" height="215" rx="20" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="985.0" y="394.0" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">SkillTool</text>
<text x="985.0" y="432.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">直接绑定且模型可见</text>
<text x="985.0" y="470.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">工作区边界 / 符号链接 / UTF-8 校验</text>
<path d="M1450 300 H2218 L2240 322 V540 H1450 Z M2218 300 V322 H2240" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="1845.0" y="377.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">受管 SKILL.md</text>
<text x="1845.0" y="415.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">agent/{agentId}/.campusclaw/</text>
<text x="1845.0" y="453.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">skills/{name}/SKILL.md</text>
<text x="1845.0" y="491.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">业务工具技术名写在正文中</text>
<rect x="2410" y="310" width="845" height="230" rx="20" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="2832.5" y="382.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">工具结果 → 模型</text>
<text x="2832.5" y="420.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">去 frontmatter 正文 + 基础目录</text>
<text x="2832.5" y="458.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">最多 10 条可读资源路径</text>
<text x="2832.5" y="496.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">不向初始 tools 集合追加业务工具</text>
<text x="1700" y="592" font-family="Times New Roman, Songti SC, serif" font-size="26" fill="#72777D" text-anchor="middle">资源来自整个 Skill 目录的可读普通文件抽样；不局限于 references / templates。</text>
<path d="M590,940 L755,940" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#aC74738)"/>
<path d="M1460,940 L1620,940" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#aC74738)"/>
<path d="M2410,940 L2570,940" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#aC74738)"/>
<path d="M2910,1095 L2910,1175" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#aC74738)"/>
<path d="M2015,1095 L2015,1175" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#aC74738)"/>
<text x="2205" y="1145" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#C74738" text-anchor="middle">缓存命中</text>
<path d="M1630,1240 L365,1240 L365,1040" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#aC74738)"/>
<rect x="110" y="845" width="480" height="195" rx="20" fill="#FFF1ED" stroke="#C74738" stroke-width="2"/>
<text x="350.0" y="919.0" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#C74738" text-anchor="middle">SearchTools</text>
<text x="350.0" y="957.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">{tool: 精确技术名}</text>
<text x="350.0" y="995.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">无查询词 / 分页 / 模糊匹配</text>
<path d="M755 815 H1438 L1460 837 V1095 H755 Z M1438 815 V837 H1460" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="1107.5" y="912.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">MateToolExecutor</text>
<text x="1107.5" y="950.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">resolveSkillDefinition()</text>
<text x="1107.5" y="988.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">返回 name / description / inputSchema</text>
<text x="1107.5" y="1026.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">范围不匹配 → TOOL_NOT_FOUND</text>
<path d="M1620 815 H2388 L2410 837 V1095 H1620 Z M2388 815 V837 H2410" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="2015.0" y="912.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">MateToolResolver</text>
<text x="2015.0" y="950.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">resolveDisclosableSkill()</text>
<text x="2015.0" y="988.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">直接绑定且模型可见 Skill 的工具</text>
<text x="2015.0" y="1026.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Session 缓存命中即复用</text>
<path d="M2570 834 A340.0 19 0 0 1 3250 834 V1076 A340.0 19 0 0 1 2570 1076 Z" fill="#F1F1F1" stroke="#302E2A" stroke-width="2"/><ellipse cx="2910.0" cy="834" rx="340.0" ry="19" fill="#F1F1F1" stroke="#302E2A" stroke-width="2"/>
<text x="2910.0" y="923.5" font-family="Times New Roman, Songti SC, serif" font-size="27" fill="#302E2A" text-anchor="middle">HttpMateToolClient → CampusMate</text>
<text x="2910.0" y="961.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">仅未命中缓存时 listSkillTools(skillId)</text>
<text x="2910.0" y="999.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">GET skill/query/{id}</text>
<text x="2910.0" y="1037.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">POST runtime/tools/query；不带凭据</text>
<path d="M1630 1175 H3228 L3250 1197 V1320 H1630 Z M3228 1175 V1197 H3250" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="2440.0" y="1243.0" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">Executor 校验定义 / SearchTools 检查结果预算</text>
<text x="2440.0" y="1281.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">完整定义 ≤ 50 KiB → 返回模型；超限返回 TOOL_DEFINITION_TOO_LARGE，不截断 Schema。</text>
<text x="875" y="1215" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#C74738" text-anchor="middle">一份完整定义</text>
<path d="M670,1680 L820,1680" fill="none" stroke="#398D42" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a398D42)"/>
<path d="M1710,1680 L1840,1680" fill="none" stroke="#398D42" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a398D42)"/>
<path d="M2460,1680 L2535,1680 L2535,1600 L2660,1600" fill="none" stroke="#398D42" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a398D42)"/>
<path d="M2535,1680 L2535,1820 L2660,1820" fill="none" stroke="#398D42" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a398D42)"/>
<rect x="110" y="1580" width="560" height="210" rx="20" fill="#F0F8ED" stroke="#398D42" stroke-width="2"/>
<text x="390.0" y="1661.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#398D42" text-anchor="middle">CallTool</text>
<text x="390.0" y="1699.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">{tool, args}</text>
<text x="390.0" y="1737.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">仅提交技术名与业务参数</text>
<path d="M820 1535 H1688 L1710 1557 V1825 H820 Z M1688 1535 V1557 H1710" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="1265.0" y="1637.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">MateToolExecutor.prepareSkill()</text>
<text x="1265.0" y="1675.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">resolveSkill：按全部直接 Skill 绑定解析</text>
<text x="1265.0" y="1713.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">业务 Schema 校验；选择并固定 handler</text>
<text x="1265.0" y="1751.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">生成不可变 PreparedToolInvocation</text>
<rect x="1840" y="1570" width="620" height="230" rx="20" fill="#F0F8ED" stroke="#398D42" stroke-width="2"/>
<text x="2150.0" y="1661.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#398D42" text-anchor="middle">Host 权限检查</text>
<text x="2150.0" y="1699.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">按真实目标工具判断</text>
<text x="2150.0" y="1737.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">通过后执行同一份快照</text>
<rect x="2660" y="1510" width="590" height="180" rx="20" fill="#F5EFFF" stroke="#805AC7" stroke-width="2"/>
<text x="2955.0" y="1576.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#805AC7" text-anchor="middle">固定本地 handler</text>
<text x="2955.0" y="1614.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">confirm_with_user</text>
<text x="2955.0" y="1652.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Runtime 问答；失败不转远端</text>
<rect x="2660" y="1730" width="590" height="180" rx="20" fill="#F0F8ED" stroke="#398D42" stroke-width="2"/>
<text x="2955.0" y="1796.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#398D42" text-anchor="middle">固定远端 handler</text>
<text x="2955.0" y="1834.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">MateRemoteToolHandler → HttpClient</text>
<text x="2955.0" y="1872.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">execute 带凭据；一次请求</text>
<text x="1700" y="2070" font-family="Times New Roman, Songti SC, serif" font-size="28" fill="#302E2A" text-anchor="middle">披露范围与调用权限不同：SearchTools 只披露模型可见 Skill；CallTool 仍须独立解析和通过 Host 权限检查。</text>
<text x="1700" y="2125" font-family="Times New Roman, Songti SC, serif" font-size="27" fill="#72777D" text-anchor="middle">同一 Session 复用元数据缓存；读取 / 发现没有调用授权效果；跨 Session 同步与自动刷新仍属待实现范围。</text>
<text x="3320" y="2208" font-family="Times New Roman, Songti SC, serif" font-size="22" fill="#72777D" text-anchor="end">源码核验：553dcd5e · CampusClaw / pi-mono-java</text>
</svg>
