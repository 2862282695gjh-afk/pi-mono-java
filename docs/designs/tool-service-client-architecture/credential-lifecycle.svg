<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2010" viewBox="0 0 3200 2010">
<title>凭据生命周期 · 本次执行内存快照与 execute-only 透传</title>
<defs>
<marker id="a2886CE" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#2886CE"/></marker>
<marker id="aC74738" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#C74738"/></marker>
<marker id="a398D42" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#398D42"/></marker>
<marker id="a805AC7" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#805AC7"/></marker>
<marker id="aA17F72" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#A17F72"/></marker>
<marker id="a72777D" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#72777D"/></marker>
<marker id="a302E2A" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="13" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#302E2A"/></marker>
</defs>
<rect width="3200" height="2010" fill="white"/>
<text x="1600.0" y="65" font-family="Times New Roman, Songti SC, serif" font-size="42" fill="#302E2A" text-anchor="middle">凭据生命周期 · 本次执行内存快照与 execute-only 透传</text>
<text x="1600.0" y="121" font-family="Times New Roman, Songti SC, serif" font-size="27" fill="#72777D" text-anchor="middle">蓝：快照建立与只读继承　绿：执行请求透传　灰：无凭据发现　红：控制与持久化边界</text>
<rect x="55" y="205" width="620" height="1650" rx="20" fill="#F7F9FC" stroke="#B2BAC4" stroke-width="2"/>
<text x="365.0" y="249" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">① 入站请求 / 触发</text>
<rect x="755" y="205" width="1290" height="1650" rx="20" fill="#FFFBF3" stroke="#D7A342" stroke-width="2"/>
<text x="1400.0" y="249" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">② 本次 Agent 执行期间</text>
<rect x="2140" y="205" width="1005" height="1650" rx="20" fill="#F4F4F4" stroke="#A3A3A3" stroke-width="2"/>
<text x="2642.5" y="249" font-family="Times New Roman, Songti SC, serif" font-size="31" fill="#302E2A" text-anchor="middle">③ HTTP 客户端与 CampusMate</text>
<path d="M625,465 L850,465" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M1395,605 L1395,660 L1165,660 L1165,740" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M1480,850 L1590,850" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M1480,950 L1520,950 L1520,1060 L2070,1060 L2070,970 L2240,970" fill="none" stroke="#398D42" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a398D42)"/>
<path d="M625,1130 L710,1130 L710,550 L850,550" fill="none" stroke="#2886CE" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a2886CE)"/>
<path d="M625,1530 L850,1530" fill="none" stroke="#C74738" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#aC74738)"/>
<path d="M2640,1145 L2640,1320" fill="none" stroke="#398D42" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#a398D42)"/>
<path d="M100 330 H603 L625 352 V620 H100 Z M603 330 V352 H625" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="362.5" y="432.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">POST Events / Command</text>
<text x="362.5" y="470.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">读取四项可选 Header</text>
<text x="362.5" y="508.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">X-HW-ID · X-HW-APPKEY</text>
<text x="362.5" y="546.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Authorization · access-token</text>
<path d="M850 330 H1918 L1940 352 V605 H850 Z M1918 330 V352 H1940" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="1395.0" y="425.0" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">MateCredentials · 不可变快照</text>
<text x="1395.0" y="463.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">缺失 Header 字段为 null；无入站凭据用 empty()</text>
<text x="1395.0" y="501.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">AppKey 与 JWT 同时存在时均保留</text>
<text x="1395.0" y="539.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">原名原值，不补默认值 / Bearer 前缀</text>
<rect x="850" y="740" width="630" height="260" rx="20" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="1165.0" y="827.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">执行上下文传递</text>
<text x="1165.0" y="865.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">EventService → SessionRegistry</text>
<text x="1165.0" y="903.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">→ SessionFactory → Remote Handler</text>
<text x="1165.0" y="941.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">只在本次执行期间内存持有</text>
<path d="M1590 750 H1973 L1995 772 V980 H1590 Z M1973 750 V772 H1995" fill="#FFF3D3" stroke="#302E2A" stroke-width="2"/>
<text x="1792.5" y="841.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">Child Agent</text>
<text x="1792.5" y="879.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">只读继承父快照</text>
<text x="1792.5" y="917.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">独立工具解析缓存</text>
<rect x="100" y="1040" width="525" height="180" rx="20" fill="#EFF7FF" stroke="#2886CE" stroke-width="2"/>
<text x="362.5" y="1106.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#2886CE" text-anchor="middle">Cron 触发</text>
<text x="362.5" y="1144.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">MateCredentials.empty()</text>
<text x="362.5" y="1182.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">没有入站调用方凭据</text>
<rect x="100" y="1440" width="525" height="190" rx="20" fill="#FFF1ED" stroke="#C74738" stroke-width="2"/>
<text x="362.5" y="1511.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#C74738" text-anchor="middle">控制请求</text>
<text x="362.5" y="1549.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">停止 / 确认 / 问答响应</text>
<text x="362.5" y="1587.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">不替换原执行凭据</text>
<path d="M850 1390 H1918 L1940 1412 V1620 H850 Z M1918 1390 V1412 H1940" fill="#FFF3D3" stroke="#C74738" stroke-width="2"/>
<text x="1395.0" y="1462.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#C74738" text-anchor="middle">凭据边界</text>
<text x="1395.0" y="1500.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">控制请求沿用原执行快照</text>
<text x="1395.0" y="1538.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">不写数据库 / Agent 目录 / Event / Prompt</text>
<text x="1395.0" y="1576.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">不进入模型消息或日志；结束后 Runtime 不再持有</text>
<path d="M2240 330 H3018 L3040 352 V605 H2240 Z M3018 330 V352 H3040" fill="#F0F0F0" stroke="#72777D" stroke-width="2"/>
<text x="2640.0" y="406.0" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#72777D" text-anchor="middle">发现请求：不传凭据</text>
<text x="2640.0" y="444.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">listAgentTools(agentId)</text>
<text x="2640.0" y="482.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">listSkillTools(skillId)</text>
<text x="2640.0" y="520.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">接口签名没有 credentials 参数</text>
<text x="2640.0" y="558.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">GET 绑定 + POST tools/query</text>
<rect x="2240" y="770" width="800" height="375" rx="20" fill="#F0F8ED" stroke="#398D42" stroke-width="2"/>
<text x="2640.0" y="877.0" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#398D42" text-anchor="middle">执行请求：callTool(..., credentials)</text>
<text x="2640.0" y="915.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">POST runtime/tools/{toolId}/execute</text>
<text x="2640.0" y="953.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">仅过滤 null / 空字符串 Header</text>
<text x="2640.0" y="991.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">四项凭据原名原值透传</text>
<text x="2640.0" y="1029.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">参数 body = {arguments: ...}</text>
<text x="2640.0" y="1067.0" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">空快照也发送一次；不自动重放</text>
<path d="M2320 1339 A320.0 19 0 0 1 2960 1339 V1561 A320.0 19 0 0 1 2320 1561 Z" fill="#F1F1F1" stroke="#302E2A" stroke-width="2"/><ellipse cx="2640.0" cy="1339" rx="320.0" ry="19" fill="#F1F1F1" stroke="#302E2A" stroke-width="2"/>
<text x="2640.0" y="1419.5" font-family="Times New Roman, Songti SC, serif" font-size="29" fill="#302E2A" text-anchor="middle">CampusMate</text>
<text x="2640.0" y="1457.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">认证与授权由 Mate 最终裁决</text>
<text x="2640.0" y="1495.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">Runtime 不校验凭据组合完整性</text>
<text x="2640.0" y="1533.5" font-family="Times New Roman, Songti SC, serif" font-size="25" fill="#302E2A" text-anchor="middle">execute 错误统一返回，不泄露敏感响应</text>
<text x="1600" y="1920" font-family="Times New Roman, Songti SC, serif" font-size="28" fill="#302E2A" text-anchor="middle">共享的 HttpMateToolClient 无 Session 状态；凭据由调用参数显式传入，不从其他请求借值，也不存入发现缓存。</text>
<text x="3120" y="1978" font-family="Times New Roman, Songti SC, serif" font-size="22" fill="#72777D" text-anchor="end">源码核验：553dcd5e · CampusClaw / pi-mono-java</text>
</svg>
