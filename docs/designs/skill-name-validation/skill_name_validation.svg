e="13" lengthAdjust="spacing" textLength="252.9287" x="1004.17" y="293.0266">ID: skill- followed by 32 hex characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.0337" x="1004.17" y="308.3372">Name: 1 to 64 ASCII characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.2925" x="1004.17" y="323.6477">Lowercase letters and digits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.0063" x="1004.17" y="338.9583">Single hyphens separate nonempty groups.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.2891" x="1004.17" y="354.2688">No leading, trailing or repeated hyphens.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="41" id="ent0019"><path d="M6,115.7683 L6,171.6999 A0,0 0 0 0 6,171.6999 L341.8945,171.6999 A0,0 0 0 0 341.8945,171.6999 L341.8945,125.7683 L331.8945,115.7683 L177.95,115.7683 L173.95,81.3083 L169.95,115.7683 L6,115.7683 A0,0 0 0 0 6,115.7683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M331.8945,115.7683 L331.8945,125.7683 L341.8945,125.7683 L331.8945,115.7683" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.4111" x="12" y="133.3366">Reject invalid publication.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.8945" x="12" y="148.6472">Preserve the last valid directory on refresh failure.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.5356" x="12" y="163.9577">Reject invalid cache and refetch on prepare.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="46" id="ent0022"><path d="M29.36,278.0783 L29.36,303.3888 A0,0 0 0 0 29.36,303.3