f" font-size="13" lengthAdjust="spacing" textLength="252.9287" x="1160.17" y="336.7988">ID: skill- followed by 32 hex characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.0337" x="1160.17" y="352.1094">Name: 1 to 64 ASCII characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.2925" x="1160.17" y="367.4199">Lowercase letters and digits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.0063" x="1160.17" y="382.7305">Single hyphens separate nonempty groups.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.2891" x="1160.17" y="398.041">No leading, trailing or repeated hyphens.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.5259" x="1160.17" y="413.3516">Description: at most 1024 characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.9063" x="1160.17" y="428.6621">File size: at most 1 MiB.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.1895" x="1160.17" y="443.9727">Directory and files: skills, SKILL.md, skill.json.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.8887" x="1160.17" y="459.2832">Command prefix: skill:</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="52" id="ent0020"><path d="M6,126.1605 L6,182.0921 A0,0 0 0 0 6,182.0921 L341.8945,182.0921 A0,0 0 0 0 341.8945,182.0921 L341.8945,136.1605 L331.8945,126.1605 L177.95,126.1605 L173.95,91.7005 L169.95,126.1605 L6,126.1605 A0,0 0 0 0 6,126.1605" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M331.8945,126.1605 L331.8945,136.1605 L341.8945,136.1605 L331.8945,126.1605" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.4111" x="12" y="143.7288">Reject invalid publication.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.8945" x="12" y="159.0394">Preserve the last valid directory on refresh failure.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.5356" x="12" y="174.3499">Reject invalid cache and refetch on prepare.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="57" id="ent0023"><path d="M29.36,288.4705 L29.36,313.781 A0,0 0 0 0 29.36,313.781 L318.5294,313.781 A0,0 0 0 0 318.5294,313.781 L318.5294,298.4705 L308.5294,288.4705 L177.95,288.4705 L173.95,253.7105 L169.95,288.4705 L29.36,288.4705 A0,0 0 0 0 29.36,288.4705" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M308.5294,288.4705 L308.5294,298.4705 L318.5294,298.4705 L308.5294,288.4705" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.1694" x="35.36" y="306.0388">Invalid skills are omitted from the prompt.</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="60" id="ent0026"><path d="M560.89,375.4705 L560.89,400.781 A0,0 0 0 0 560.89,400.781 L815.1664,400.781 A0,0 0 0 0 815.1664,400.781 L815.1664,385.4705 L805.1664,375.4705 L692.03,375.4705 L688.03,340.7105 L684.03,375.4705 L560.89,375.4705 A0,0 0 0 0 560.89,375.4705" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M805.1664,375.4705 L805.1664,385.4705 L815.1664,385.4705 L805.1664,375.4705" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.2764" x="566.89" y="393.0388">Invalid names produce no command.</text></g><!--link Runtime to Loader--><g class=