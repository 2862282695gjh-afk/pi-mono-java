" x="632.21" y="390.9105"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.0488" x="642.21" y="414.4456">SkillCommandSource</text></g><!--entity Constants--><g class="entity" data-qualified-name="Constants" data-source-line="37" id="ent0005"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="152.6855" x="1284.83" y="326.6705"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.6855" x="1294.83" y="350.2056">ClawConstants.Skill</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.751" x="1294.83" y="366.6939">(common module)</text></g><!--entity MetadataClient--><g class="entity" data-qualified-name="MetadataClient" data-source-line="38" id="ent0006"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="139.6631" x="643.91" y="522.9105"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.6631" x="653.91" y="546.4456">MateServiceClient</text></g><!--entity ToolClient--><g class="entity" data-qualified-name="ToolClient" data-source-line="39" id="ent0007"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="152.002" x="637.74" y="593.9105"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.002" x="647.74" y="617.4456">HttpMateToolClient</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="49" id="ent0017"><path d="M1205.58,414.2605 L1205.58,562.0554 A0,0 0 0 0 1205.58,562.0554 L1516.7695,562.0554 A0,0 0 0 0 1516.7695,562.0554 L1516.7695,424.2605 L1506.7695,414.2605 L1365.18,414.2605 L1361.18,379.6905 L1357.18,414.2605 L1205.58,414.2605 A0,0 0 0 0 1205.58,414.2605" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1506.7695,414.2605 L1506.7695,424.2605 L1516.7695,424.2605 L1506.7695,414.2605" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.9287" x="1211.58" y="431.8288">ID: skill- followed by 32 hex characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.0337" x="1211.58" y="447.1394">Name: 1 to 64 ASCII characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.2925" x="1211.58" y="462.4499">Lowercase letters and digits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.0063" x="1211.58" y="477.7605">Single hyphens separate nonempty groups.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.2891" x="1211.58" y="493.071">No leading, trailing or repeated hyphens.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.5259" x="1211.58" y="508.3816">Description: at most 1024 characters.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.9063" x="1211.58" y="523.6921">File size: at most 1 MiB.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.1895" x="1211.58" y="539.0027">Directory and files: skills, SKILL.md, skill.json.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.8887" x="1211.58" y="554.3132">Command prefix: skill:</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="60" id="ent0020"><path d="M6,137.1905 L6,193.1221 A0,0 0 0 0 6,193.1221 L341.8945,193.1221 A0,0 0 0 0 341.8945,193.1221 L341.8945,147.1905 L331.8945,137.1905 L177.95,137.1905 L173.95,102.7305 L169.95,137.1905 L6,137.1905 A0,0 0 0 0 6,137.1905" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M331.8945,137.1905 L331.8945,147.1905 L341.8945,147.1905 L331.8945,137.1905" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.4111" x="12" y="154.7588">Reject invalid publication.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.8945" x="12" y="170.0694">Preserve the last valid directory on refresh failure.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.5356" x="12" y="185.3799">Reject invalid cache and refetch on prepare.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="65" id="ent0023"><path d="M29.36,342.5005 L29.36,367.811 A0,0 0 0 0 29.36,367.811 L318.5294,367.811 A0,0 0 0 0 318.5294,367.811 L318.5294,352.5005 L308.5294,342.5005 L177.95,342.5005 L173.95,307.7405 L169.95,342.5005 L29.36,342.5005 A0,0 0 0 0 29.36,342.5005" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M308.5294,342.5005 L308.5294,352.5005 L318.5294,352.5005 L308.5294,342.5005" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.1694" x="35.36" y="360.0688">Invalid skills are omitted from the prompt.</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="68" id="ent0026"><path d="M560.89,110.8805 L560.89,197.4332 A0,0 0 0 0 560.89,197.4332 L709.74,197.4332 L713.74,232.5905 L717.74,197.4332 L866.576,197.4332 A0,0 0 0 0 866.576,197.4332 L866.576,120.8805 L856.576,110.8805 L560.89,110.8805 A0,0 0 0 0 560.89,110.8805" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M856.576,110.8805 L856.576,120.8805 L866.576,120.8805 L856.576,110.8805" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.4897" x="566.89" y="128.4488">Require an explicit nonempty String.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.0508" x="566.89" y="143.7594">Validate with the shared strict name rule.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.916" x="566.89" y="159.0699">Match the directory name exactly.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.9468" x="566.89" y="174.3805">No fallback, coercion, trim, or rename.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.686" x="566.89" y="189.691">Single load fails; bulk scan skips invalid files.</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="75" id="ent0029"><path d="M586.6,462.5005 L586.6,487.811 A0,0 0 0 0 586.6,487.811 L840.8764,487.811 A0,0 0 0 0 840.8764,487.811 L840.8764,472.5005 L830.8764,462.5005 L717.74,462.5005 L713.74,427.7405 L709.74,462.5005 L586.6,462.5005 A0,0 0 0 0 586.6,462.5005" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M830.8764,462.5005 L830.8764,472.5005 L840.8764,472.5005 L830.8764,462.5005" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.2764" x="592.6" y="480.0688">Invalid names produce no command.</text></g><!--link Runtime to Loader--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="40" id="lnk8"><path d="M261.59,99.4605 C287.69,104.9705 316.21,111.9005 341.89,120.1605 C442.91,152.6105 460.22,181.6805 560.89,215.1605 C595.6,226.7005 631.0339,235.0664 661.4039,241.3564" fill="none" id="Runtime-to-Loader" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="666.3,242.3705,658.2983,236.6283,661.