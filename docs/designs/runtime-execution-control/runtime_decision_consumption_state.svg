<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="558px" preserveAspectRatio="none" style="width:714px;height:558px;background:#FFFFFF;" version="1.1" viewBox="0 0 714 558" width="714px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="155"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="264.8926" x="221.5192" y="23.5352">Durable Decision Consumption State</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="165" id="ent0001"><ellipse cx="286.25" cy="53.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="70.6484" x="250.93" y="140.7983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6484" x="255.93" y="166.0893">PENDING</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="70.9766" x="488.76" y="288.7283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.9766" x="493.76" y="314.0193">CLAIMED</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="92.3389" x="191.08" y="421.6583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.3389" x="196.08" y="446.9493">COMPLETED</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="82.502" x="7" y="288.7283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.502" x="12" y="314.0193">CANCELED</text><g class="end_entity" data-qualified-name=".end." data-source-line="169" id="ent0010"><ellipse cx="98.25" cy="533.9683" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="98.25" cy="533.9683" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN13" data-source-line="172" id="ent0014"><path d="M356.86,140.4883 L356.86,156.7983 L321.88,160.7983 L356.86,164.7983 L356.86,181.1094 A0,0 0 0 0 356.86,181.1094 L695.6491,181.1094 A0,0 0 0 0 695.6491,181.1094 L695.6491,150.4883 L685.6491,140.4883 L356.86,140.4883 A0,0 0 0 0 356.86,140.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M685.6491,140.4883 L685.6491,150.4883 L695.6491,150.4883 L685.6491,140.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.3628" x="362.86" y="158.0566">STOPPING blocks claims but keeps PENDING.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.7891" x="362.86" y="173.3672">CONFIRMING closes a segment, not the execution.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="176" id="ent0017"><path d="M124.27,273.1083 L124.27,304.7283 L89.67,308.7283 L124.27,312.7283 L124.27,344.3505 A0,0 0 0 0 124.27,344.3505 L454.2231,344.3505 A0,0 0 0 0 454.2231,344.3505 L454.2231,283.1083 L444.2231,273.1083 L124.27,273.1083 A0,0 0 0 0 124.27,273.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M444.2231,273.1083 L444.2231,283.1083 L454.2231,283.1083 L444.2231,273.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.3584" x="130.27" y="290.6766">claimed_at stays NULL.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.0249" x="130.27" y="305.9872">completed_at equals execution.terminal_at.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.9531" x="130.27" y="321.2977">Accepted input and public receipt remain stored.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.2524" x="130.27" y="336.6083">Terminal retries retain the original timestamp.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="182" id="ent0020"><path d="M348.58,421.3483 L348.58,461.9694 A0,0 0 0 0 348.58,461.9694 L699.9311,461.9694 A0,0 0 0 0 699.9311,461.9694 L699.9311,431.3483 L689.9311,421.3483 L528.25,421.3483 L524.25,329.0483 L520.25,421.3483 L348.58,421.3483 A0,0 0 0 0 348.58,421.3483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M689.9311,421.3483 L689.9311,431.3483 L699.9311,431.3483 L689.9311,421.3483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.3511" x="354.58" y="438.9166">Terminal commit does not cancel claimed decisions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.9673" x="354.58" y="454.2272">Their existing acknowledgement may still complete.</text></g><!--link *start* to PENDING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="165" id="lnk3"><path d="M286.25,63.8283 C286.25,80.9483 286.25,112.6483 286.25,135.3783" fill="none" id="*start*-to-PENDING" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="286.25,140.3783,290.25,131.3783,286.25,135.3783,282.25,131.3783,286.25,140.3783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8203" x="287.25" y="107.0566">accept and persist user decision</text></g><!--link PENDING to CLAIMED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="166" id="lnk5"><path d="M319.59,181.2883 C356.83,203.1983 418.77,240.0283 471.25,273.1083 C478.97,277.9683 483.0639,280.5839 490.7339,285.5939" fill="none" id="PENDING-to-CLAIMED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="494.92,288.3283,489.5725,280.0576,490.7339,285.5939,485.1976,286.7554,494.92,288.3283" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.0728" x="421.84" y="232.1766">claim once while execution can run</text></g><!--link CLAIMED to COMPLETED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="167" id="lnk7"><path d="M497.87,329.0483 C489.62,334.5083 480.31,340.1083 471.25,344.3483 C430,363.6583 415.63,357.6483 373.25,374.3483 C338.43,388.0683 304.6594,404.7387 277.6394,418.8887" fill="none" id="CLAIMED-to-COMPLETED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="273.21,421.2083,283.0386,420.5765,277.6394,418.8887,279.3272,413.4895,273.21,421.2083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.3369" x="374.25" y="387.9166">acknowledge handling</text></g><!--link PENDING to CANCELED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" data-source-line="168" id="lnk9"><path d="M250.53,174.7583 C227.73,183.6583 197.93,196.4883 173.25,211.1083 C134.31,234.1683 97.4115,264.3557 73.4215,285.2357" fill="none" id="PENDING-to-CANCELED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="69.65,288.5183,79.0649,285.6268,73.4215,285.2357,73.8127,279.5924,69.65,288.5183" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="san