just="spacing" textLength="122.313" x="384.84" y="357.7866">Observed behavior:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.3027" x="384.84" y="373.0972">tool.execution selects local or Docker execution.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="755.3203" x="384.84" y="388.4077">Source: modules/coding-agent-cli/src/main/java/com/campusclaw/codingagent/tool/execution/ExecutionRouter.java</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="45" id="ent0032"><path d="M2298.16,191.9783 L2298.16,263.2205 L2925.8372,263.2205 L2925.8372,201.9783 L2915.8372,191.9783 L2298.16,191.9783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2915.8372,191.9783 L2915.8372,201.9783 L2925.8372,201.9783 L2915.8372,191.9783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.1865" x="2304.16" y="209.5466">Design reason:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.8911" x="2304.16" y="224.8572">one local catalog plus MateService authority</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.6064" x="2304.16" y="240.1677">removes duplicate execution routing and DinD.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="606.6772" x="2304.16" y="255.4783">Source: modules/coding-agent-cli/src/main/java/com/campusclaw/codingagent/tool/catalog/</text></g><g class="entity" data-qualified-name="GMN34" data-source-line="52" id="ent0035"><path d="M1658.59,207.2883 L1658.59,247.9094 A0,0 0 0 0 1658.59,247.9094 L2263.403,247.9094 A0,0 0 0 0 2263.403,247.9094 L2263.403,217.2883 L2253.403,207.2883 L1885.71,207.2883 L1498.93,111.6483 L1877.71,207.2883 L1658.59,207.2883 A0,0 0 0 0 1658