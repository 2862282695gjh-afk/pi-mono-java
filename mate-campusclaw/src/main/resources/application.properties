# 排除公司父项目传递进来的全部 actuator 自动配置
management.endpoints.enabled-by-default=false
spring.autoconfigure.exclude=\
  org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.audit.AuditAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.audit.AuditEventsEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.availability.AvailabilityHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.availability.AvailabilityProbesAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.cache.CachesEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.condition.ConditionsReportEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.context.ShutdownEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.data.mongo.MongoHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.elasticsearch.ElasticSearchRestHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.endpoint.EndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.endpoint.web.WebEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.env.EnvironmentEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.health.HealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.health.HealthEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.info.InfoContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.info.InfoEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.jms.JmsHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.logging.LoggersEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.metrics.MetricsAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.metrics.MetricsEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.mongo.MongoHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.observation.ObservationAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.scheduling.ScheduledTasksEndpointAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.system.DiskSpaceHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.web.exchanges.HttpExchangesAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.web.server.ManagementServerAutoConfiguration
spring.main.banner-mode=off
spring.main.lazy-initialization=true
spring.main.web-application-type=none
spring.application.name=mate-campusclaw
spring.datasource.url=${GAUSSDB_URL:jdbc:opengauss://localhost:5432/campusclaw}
spring.datasource.username=${GAUSSDB_USER:campusclaw}
spring.datasource.password=${GAUSSDB_PASSWORD:}
spring.datasource.driver-class-name=org.opengauss.Driver
spring.datasource.hikari.pool-name=campusclaw-session-pool
spring.datasource.hikari.minimum-idle=${GAUSSDB_MIN_IDLE:1}
spring.datasource.hikari.maximum-pool-size=${GAUSSDB_MAX_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${GAUSSDB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${GAUSSDB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.initialization-fail-timeout=${GAUSSDB_INITIALIZATION_FAIL_TIMEOUT_MS:-1}
spring.datasource.hikari.data-source-properties.currentSchema=${GAUSSDB_SCHEMA:campusclaw_session}
spring.datasource.hikari.data-source-properties.sslmode=${GAUSSDB_SSL_MODE:verify-full}
mybatis.mapper-locations=classpath*:mapper/session/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.root=WARN
logging.level.com.huawei.hicampus.mate.matecampusclaw=WARN
logging.level.org.springframework=WARN
logging.level.io.netty=ERROR
# Banner logger 独立级别，让 `--mode server` 启动 endpoint 列表无论 root/包级
# 怎么调都能打出来——这是面向操作者的启动反馈，不该被生产噪音过滤策略误伤。
logging.level.CampusClawStartupBanner=INFO

# Control plane in-process heartbeat tuning. This mirrors the modules/coding-agent-cli
# application.yml defaults while keeping mate-campusclaw's hand-maintained properties file.
controlplane.heartbeat.ttl=PT30S
controlplane.heartbeat.sweep-interval=PT10S
controlplane.heartbeat.grace-after-stale=PT5M
