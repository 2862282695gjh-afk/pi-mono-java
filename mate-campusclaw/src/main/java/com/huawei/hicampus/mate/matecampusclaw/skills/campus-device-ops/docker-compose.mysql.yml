# Local MySQL for device inspection API (optional)
#
#   docker compose -f <skill-path>/docker-compose.mysql.yml up -d
#   mysql -h 127.0.0.1 -P 3306 -u campus -pcampus campus_inspection < <skills-dir>/device-inspection-re/templates/schema.mysql.sql
#
# Or let db_backend init_schema() create tables on first connect.

services:
  mysql:
    image: mysql:8.0
    container_name: campus-inspection-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_inspection
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus
    ports:
      - "3306:3306"
    volumes:
      - campus_inspection_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  campus_inspection_mysql_data:
